name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plumbline
          POSTGRES_PASSWORD: synthetic-tests
          POSTGRES_DB: plumbline_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plumbline -d plumbline_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PLUMBLINE_TEST_DATABASE_URL: postgresql+psycopg://plumbline:synthetic-tests@127.0.0.1:5432/plumbline_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: PYTHON=python scripts/test-all.sh
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/phase0_ui_smoke.py
