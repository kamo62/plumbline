# Local Development Docker Compose
# Use this file for local development on your machine
#
# Local evaluation only. Supply your own credentials in the ignored .env file.
#
# Key features:
# - Reads from .env file
# - Port 8000 on localhost only
# - Includes dev dependencies (INSTALL_DEV=true)
# - Source code mounted for live reload
# - Uvicorn --reload enabled

version: "3.8"

services:
  db:
    image: postgres:16
    container_name: metrics-db
    environment:
      - POSTGRES_USER=metrics_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a fresh URL-safe value}
      - POSTGRES_DB=metrics_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - plumbline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics_user -d metrics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: plumbline
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    pull_policy: build
    container_name: metrics-app
    env_file: .env
    environment:
      - PLUMBLINE_DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    image: plumbline
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    pull_policy: build
    container_name: metrics-api
    env_file: .env
    environment:
      - PLUMBLINE_RUN_ENV=local
      - PLUMBLINE_AUTO_RUN_MIGRATIONS=true
      - PLUMBLINE_DISABLE_TIMESCALE_FEATURES=true
      - PLUMBLINE_DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
    command: uvicorn plumbline.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Optional: one-shot migration helper (run with profile 'tools')
  db-migrate:
    image: plumbline
    build: .
    container_name: metrics-db-migrate
    environment:
      - PLUMBLINE_DATABASE_URL=postgresql+psycopg://metrics_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/metrics_db
      - PLUMBLINE_RUN_ENV=local
      - PLUMBLINE_DISABLE_TIMESCALE_FEATURES=true
    command: python scripts/migrate.py
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

  cleanup:
    image: plumbline
    build: .
    container_name: metrics-cleanup
    environment:
      - PLUMBLINE_RUN_ENV=local
      - PLUMBLINE_EXPORTS_RETENTION_DAYS=${PLUMBLINE_EXPORTS_RETENTION_DAYS:-30}
    volumes:
      - .:/app
    command: ["python", "scripts/cleanup_exports.py", "--path", "/app/exports", "--retention-days", "${PLUMBLINE_EXPORTS_RETENTION_DAYS:-30}"]
    profiles:
      - tools

volumes:
  plumbline_pgdata:
    driver: local
